name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases on version tags

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The unit tests only use the standard library.
      - run: python -m unittest discover tests -v

  windows:
    # Build the app for pull requests (proves it still packages), version
    # tags (publishes a release) and manual runs (Actions tab -> Build -> Run).
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    needs: tests
    runs-on: windows-latest
    env:
      WIELD_DATA_DIR: ${{ github.workspace }}\ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Wield.exe
        run: pyinstaller Wield.spec --noconfirm

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Wield\Wield.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content "$env:WIELD_DATA_DIR\self_test.log"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Wield -DestinationPath Wield-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Wield-windows
          path: Wield-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" Wield-windows.zip `
            --title "Wield ${{ github.ref_name }}" `
            --notes "Download Wield-windows.zip, extract it and run Wield\Wield.exe. Requires Windows 10/11 and a webcam."
